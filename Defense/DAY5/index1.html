<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration form</h1>
    <p>please fill out the form below to register</p>
    <hr>
    <h2>Personal Details </h2>
    
    <Label for="Name">First Name</Label>
    <input type="text" name="name" id="Name" placeholder="eg.Dayanand">
    <Label for="SurName">Last Name</Label>
    <input type="text" name="Surname" id="Surname" placeholder="eg.Kumar">
    
    <br><br>

    <Label for="DOB">Date of Birth</Label>
    <input type="date" name="DOB" id="DOB">
   
    <br><br>
    <h3>Gender:</h3>
    <label for="Male">Male</label>
    <input type="radio" name="Gender" id="Male" value="Male">
    <br><br>
    <label for="Female">Female</label>
    <input type="radio" name="Gender" id="Female" value="Female">
    <br><br>
    <label for="Other">other</label>
    <input type="radio" name="Gender" id="Other" value="Other">

    <br><br>
    <h3>Upload Your Photo</h3>
    <input type="file" name="file">
    <hr>
    <h2>Contact Information</h2>
    <label for="email">Email Address</label>
    <input type="email" name="email" id="email" placeholder="you@example.com">
   <br><br>
    <label for="phone">Phone Number</label>
    <input type="tel" name="phone" id="phone" placeholder="+91">
   <br><br>
    <label for="Address">Mail Address</label>
    <br>
    <textarea name="Address" id="Address" rows="10" cols="20"></textarea>
   <br><br>
   <hr>
   <h2>Academic Information</h2>
   <label for="course">Select Your Course</label>
   <select name="course" id="course">
   <option value="CSE">CSE</option>       
   <option value="IT">IT</option>       
   <option value="ME">ME</option>       
   <option value="CE">CE</option> </select> 
   <br>
   <h3>Extracurricular Interests</h3>
   <label for="Sports">Sports</label>
   <input type="checkbox" name="Interests" id="Sports" value="Sports">
   <br>   
   <label for="Music&Arsts">Music&Arts</label>
   <input type="checkbox" name="Interests" id="Music&Arts" value="Music&Arts">
   <br>   
   <label for="Technology Clubs">Technology Clubs</label>
   <input type="checkbox" name="Interests" id="Technology CLubs" value="Technology clubs">
   <br>   
   <label for="Volunteering">Volunteering</label>
   <input type="checkbox" name="Interests" id="Volunteering" value="Volunteering">
   <br><br>
   <hr>
   <h2>Create Your Account</h2>   
   <label for="password">Create a Password</label>
   <input type="password" name="password" id="password">
   <br><br>
   <label for="Security">Security Question</label>
   <input type="text" name="Security" id="Security" placeholder="what was your first pet Name?">
   <br><br>
   <label for="Security">Security Answerc</label>
   <input type="text" name="Security" id="Security">
   <hr>
   <button type="submit">Register</button>
   <button type="reset">clear form</button>
     

</body>
</html>
