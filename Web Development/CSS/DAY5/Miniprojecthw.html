<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="Miniproject.css">
</head>
<body>

    <div class="box">

        <form>

            <h1>Sign Up</h1>

            <div>
                <label for="user" style="display:block;">Username</label>
                <input type="text" id="user" placeholder="Enter your username" style="display:block;">
            </div>

            <div>
                <label for="name" style="display:block;">Name</label>
                <input type="text" id="name" placeholder="Enter your name" style="display:block;">
            </div>

            <div>
                <label for="pass" style="display:block;">Password</label>
                <input type="password" id="pass" placeholder="Enter your password" style="display:block;">
            </div>

            <div>
                <label for="cpass" style="display:block;">Confirm Password</label>
                <input type="password" id="cpass" placeholder="Re-enter your password" style="display:block;">
            </div>

            <div>
                <input type="checkbox" id="check">
                <label for="check">I agree to Terms & Conditions</label>
            </div>

            <button style="width:100%; height:45px; font-size:20px; background:#22224d; color:white; border:none; border-radius:25px;">
                Sign Up
            </button>

            <p style="text-align:center; margin-top:20px;">
                Already a member?
                <a href="#">Sign In</a>
            </p>

        </form>

    </div>

</body>
</html>
