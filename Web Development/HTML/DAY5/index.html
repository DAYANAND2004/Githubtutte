<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <style>
        .form-container {
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <label for="Name">Name</label>
        <input type="text" name="username" id="Name">
    </div>

    <div class="form-container">
        <label for="fName">Father Name</label>
        <input type="text" name="fatherName" id="fName">
    </div>

    <div class="form-container">
        <label for="age">Age</label>
        <input type="text" name="age" id="age">
    </div>
    <div class="form-container">
        <label for="Pass">Password</label>
        <input type="password" name="Userpassword" id="pass">
    </div>
    </div>
    <div class="form-container">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="female">female</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="other">Other</label>
        <input type="radio" name="gender" id="other" value="other">
    </div>
    <br><br>
    <div class="form-container">
        <label for="C++">C++</label>
        <input type="checkbox" name="Subject" id="C++" value="C++">
    </div>
    <div class="form-container">
        <label for="Jave">Java</label>
        <input type="checkbox" name="Subject" id="Java" value="Java">
    </div>
    <div class="form-container">
        <label for="Python">Python</label>
        <input type="checkbox" name="Subject" id="Python" value="Python">
    </div>
    <div class="form-container">
        <label for="Javascript">Javascript</label>
        <input type="checkbox" name="Subject" id="Javascript" value="Javascript">
    </div>
    <br><br>
<input type="submit">
</body>
</html>
